AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: "SAM Conversion: Serverless Framework hello-world-lambda to AWS SAM"

Parameters:
  Stage:
    Type: String
    Default: dev
    Description: Deployment stage
    AllowedValues:
      - dev
      - staging
      - prod

Globals:
  Function:
    # 모든 함수에 공통으로 적용되는 설정 (01-hello-world/serverless.yml 참조)
    Timeout: 30
    MemorySize: 128
    Runtime: nodejs18.x
    Architectures:
      - x86_64
    Environment:
      Variables:
        STAGE: !Ref Stage
        LOG_LEVEL: INFO
        SERVICE_NAME: hello-world-lambda
        ITEMS_TABLE: !Sub "hello-world-items-sam-${Stage}"

Resources:
  # ============================================
  # IAM Role for Lambda Functions
  # 출처: 01-hello-world/serverless.yml provider.iam.role
  # ============================================
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "HelloWorldRole-sam-${Stage}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*"
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                  - dynamodb:Query
                Resource:
                  - !GetAtt ItemsTable.Arn
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/sam-hello-world-items-*"

  # ============================================
  # CloudWatch Logs Role for API Gateway
  # ============================================
  ApiGatewayCloudWatchLogsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchLogsFullAccess

  ApiGatewayAccountSetting:
    Type: AWS::ApiGateway::Account
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGatewayCloudWatchLogsRole.Arn

  # ============================================
  # Lambda Functions
  # ============================================

  # Function 1: SayHello - No parameters
  # 출처: 01-hello-world/serverless.yml functions.sayHello
  SayHelloFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub hello-world-sam-say-hello-${Stage}
      CodeUri: ./handlers
      Handler: hello.helloHandler
      Role: !GetAtt LambdaExecutionRole.Arn
      Description: Simplest Lambda - returns Hello
      Events:
        HttpEvent:
          Type: Api
          Properties:
            RestApiId: !Ref HelloWorldApi
            Path: /hello
            Method: GET
      Tags:
        Environment: !Ref Stage
        Service: HelloWorld
        Owner: Jason

  # Function 2: Greet - Path parameter
  # 출처: 01-hello-world/serverless.yml functions.greet
  GreetFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub hello-world-sam-greet-${Stage}
      CodeUri: ./handlers
      Handler: hello.greetHandler
      Role: !GetAtt LambdaExecutionRole.Arn
      Description: Returns greeting with name parameter
      Events:
        HttpEvent:
          Type: Api
          Properties:
            RestApiId: !Ref HelloWorldApi
            Path: /hello/{name}
            Method: GET
      Tags:
        Environment: !Ref Stage
        Service: HelloWorld
        Owner: Jason

  # Function 3: CreateMessage - POST with body
  # 출처: 01-hello-world/serverless.yml functions.createMessage
  CreateMessageFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub hello-world-sam-create-message-${Stage}
      CodeUri: ./handlers
      Handler: hello.createMessageHandler
      Role: !GetAtt LambdaExecutionRole.Arn
      Description: Creates a message from POST body
      Events:
        HttpEvent:
          Type: Api
          Properties:
            RestApiId: !Ref HelloWorldApi
            Path: /message
            Method: POST
      Tags:
        Environment: !Ref Stage
        Service: HelloWorld
        Owner: Jason

  # Function 4: Divide - Error handling
  # 출처: 01-hello-world/serverless.yml functions.divide
  DivideFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub hello-world-sam-divide-${Stage}
      CodeUri: ./handlers
      Handler: hello.divideHandler
      Role: !GetAtt LambdaExecutionRole.Arn
      Description: Divides two numbers (error handling demo)
      Events:
        HttpEvent:
          Type: Api
          Properties:
            RestApiId: !Ref HelloWorldApi
            Path: /divide/{a}/{b}
            Method: GET
      Tags:
        Environment: !Ref Stage
        Service: HelloWorld
        Owner: Jason

  # Function 5: ListItems - DynamoDB Scan
  # 출처: 01-hello-world/serverless.yml functions.listItems
  ListItemsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub hello-world-sam-list-items-${Stage}
      CodeUri: ./handlers
      Handler: hello.listItemsHandler
      Role: !GetAtt LambdaExecutionRole.Arn
      Description: Lists all items from DynamoDB
      Events:
        HttpEvent:
          Type: Api
          Properties:
            RestApiId: !Ref HelloWorldApi
            Path: /items
            Method: GET
      Tags:
        Environment: !Ref Stage
        Service: HelloWorld
        Owner: Jason

  # Function 6: CreateItem - DynamoDB Put
  # 출처: 01-hello-world/serverless.yml functions.createItem
  CreateItemFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub hello-world-sam-create-item-${Stage}
      CodeUri: ./handlers
      Handler: hello.createItemHandler
      Role: !GetAtt LambdaExecutionRole.Arn
      Description: Creates a new item in DynamoDB
      Events:
        HttpEvent:
          Type: Api
          Properties:
            RestApiId: !Ref HelloWorldApi
            Path: /item
            Method: POST
      Tags:
        Environment: !Ref Stage
        Service: HelloWorld
        Owner: Jason

  # Function 7: UpdateItem - DynamoDB Update
  # 출처: 01-hello-world/serverless.yml functions.updateItem
  UpdateItemFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub hello-world-sam-update-item-${Stage}
      CodeUri: ./handlers
      Handler: hello.updateItemHandler
      Role: !GetAtt LambdaExecutionRole.Arn
      Description: Updates an item (PUT method demo)
      Events:
        HttpEvent:
          Type: Api
          Properties:
            RestApiId: !Ref HelloWorldApi
            Path: /item/{id}
            Method: PUT
      Tags:
        Environment: !Ref Stage
        Service: HelloWorld
        Owner: Jason

  # Function 8: DeleteItem - DynamoDB Delete
  # 출처: 01-hello-world/serverless.yml functions.deleteItem
  DeleteItemFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub hello-world-sam-delete-item-${Stage}
      CodeUri: ./handlers
      Handler: hello.deleteItemHandler
      Role: !GetAtt LambdaExecutionRole.Arn
      Description: Deletes an item (DELETE method demo)
      Events:
        HttpEvent:
          Type: Api
          Properties:
            RestApiId: !Ref HelloWorldApi
            Path: /item/{id}
            Method: DELETE
      Tags:
        Environment: !Ref Stage
        Service: HelloWorld
        Owner: Jason

  # ============================================
  # DynamoDB Table
  # 출처: 01-hello-world/serverless.yml resources.Resources.ItemsTable
  # ============================================
  ItemsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "hello-world-items-sam-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      Tags:
        - Key: Environment
          Value: !Ref Stage
        - Key: Service
          Value: HelloWorld

  # ============================================
  # API Gateway
  # 출처: 01-hello-world/serverless.yml functions[*].events[*].http.cors
  # ============================================
  HelloWorldApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "hello-world-sam-api-${Stage}"
      StageName: !Ref Stage
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"
      Tags:
        Environment: !Ref Stage
        Service: HelloWorld
        Owner: Jason

Outputs:
  HelloWorldApiEndpoint:
    Description: Hello World API endpoint URL
    Value: !Sub "https://${HelloWorldApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
    Export:
      Name: !Sub "HelloWorldApi-${Stage}-Endpoint"

  ItemsTableName:
    Description: DynamoDB Items Table Name
    Value: !Ref ItemsTable
    Export:
      Name: !Sub "ItemsTable-${Stage}-Name"

  ItemsTableArn:
    Description: DynamoDB Items Table ARN
    Value: !GetAtt ItemsTable.Arn
    Export:
      Name: !Sub "ItemsTable-${Stage}-Arn"

  LambdaExecutionRoleArn:
    Description: ARN of Lambda Execution Role
    Value: !GetAtt LambdaExecutionRole.Arn
    Export:
      Name: !Sub "LambdaExecutionRole-${Stage}-Arn"
