AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: SAM S3 API

Parameters:
  Stage:
    Type: String
    Default: dev

Resources:
  S3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "api-s3-${Stage}-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:*
                Resource:
                  - !GetAtt S3Bucket.Arn
                  - !Sub "${S3Bucket.Arn}/*"

  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Stage

  ListFunc:
    Type: AWS::Serverless::Function
    Properties:
      Handler: s3.listFiles
      Runtime: nodejs18.x
      CodeUri: handlers/
      Role: !GetAtt LambdaRole.Arn
      Environment:
        Variables:
          BUCKET_NAME: !Ref S3Bucket
      Events:
        List:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /files
            Method: GET

  UploadFunc:
    Type: AWS::Serverless::Function
    Properties:
      Handler: s3.uploadFile
      Runtime: nodejs18.x
      CodeUri: handlers/
      Role: !GetAtt LambdaRole.Arn
      Environment:
        Variables:
          BUCKET_NAME: !Ref S3Bucket
      Events:
        Upload:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /files/upload
            Method: POST

  GetFunc:
    Type: AWS::Serverless::Function
    Properties:
      Handler: s3.getFile
      Runtime: nodejs18.x
      CodeUri: handlers/
      Role: !GetAtt LambdaRole.Arn
      Environment:
        Variables:
          BUCKET_NAME: !Ref S3Bucket
      Events:
        Get:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /files/{key}
            Method: GET

  DelFunc:
    Type: AWS::Serverless::Function
    Properties:
      Handler: s3.deleteFile
      Runtime: nodejs18.x
      CodeUri: handlers/
      Role: !GetAtt LambdaRole.Arn
      Environment:
        Variables:
          BUCKET_NAME: !Ref S3Bucket
      Events:
        Del:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /files/{key}
            Method: DELETE

  ProcessFunc:
    Type: AWS::Serverless::Function
    Properties:
      Handler: s3.processUpload
      Runtime: nodejs18.x
      CodeUri: handlers/
      Role: !GetAtt LambdaRole.Arn
      Environment:
        Variables:
          BUCKET_NAME: !Ref S3Bucket

Outputs:
  ApiEndpoint:
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
  BucketName:
    Value: !Ref S3Bucket
